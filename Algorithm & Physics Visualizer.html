<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algorithm & Physics Visualizer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--panel:#f1f3f6;--fg:#1b1f27;--mut:#5b6472;--ac:#2563eb;--a2:#f59e0b;--ok:#16a34a;--bad:#dc2626;--wall:#334155;--cell:#e2e8f0;--bd:#d5dae1;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--panel:#171e28;--fg:#e6eaf0;--mut:#96a1b1;--ac:#5b8cff;--a2:#fbbf24;--ok:#34d399;--bad:#f87171;--wall:#94a3b8;--cell:#222c3a;--bd:#2b3646;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--panel:#171e28;--fg:#e6eaf0;--mut:#96a1b1;--ac:#5b8cff;--a2:#fbbf24;--ok:#34d399;--bad:#f87171;--wall:#94a3b8;--cell:#222c3a;--bd:#2b3646;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.28;z-index:-1;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
body::before{background:var(--ac);top:-160px;left:-140px}
body::after{background:#a855f7;bottom:-180px;right:-120px;animation-delay:-9s}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
@keyframes drift{to{transform:translate(90px,70px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes shine{to{background-position:200% center}}
@keyframes beat{50%{transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
main{max-width:980px;margin:0 auto;padding:16px}
header{animation:rise .6s both}
h1{font-size:clamp(24px,5vw,36px);margin:0;letter-spacing:-.02em;background:linear-gradient(90deg,var(--ac),#a855f7,var(--a2),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.sub{color:var(--mut);margin:4px 0 18px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s}
button:hover{transform:translateY(-2px);box-shadow:0 6px 18px -6px var(--ac)}
button:active{transform:scale(.97)}
button.on,button.pri{background:linear-gradient(135deg,var(--ac),#a855f7);border-color:transparent;color:#fff;box-shadow:0 6px 20px -8px var(--ac)}
#ctl{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;margin-bottom:12px;padding:14px 16px;background:color-mix(in srgb,var(--panel) 70%,transparent);border:1px solid var(--bd);border-radius:16px;backdrop-filter:blur(10px);animation:rise .6s both}
#pp{display:contents}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:140px}
label b{color:var(--fg);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac)}
#bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cv{background:var(--panel);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px -30px var(--ac);animation:rise .8s both}
canvas{display:block;width:100%;touch-action:none}
#hint{color:var(--mut);font-size:13px;min-height:20px;margin:8px 0 0}
footer{margin:26px 0 8px;text-align:center;color:var(--mut);font-size:13px}
footer b{background:linear-gradient(90deg,var(--ac),#a855f7,var(--a2),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;font-weight:700;letter-spacing:.03em}
.hrt{color:var(--bad);display:inline-block;animation:beat 1.4s infinite}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<main>
<header><h1>Algorithm & Physics Visualizer</h1><p class="sub">Watch algorithms think and physics move, live in your browser.</p></header>
<nav id="tabs">
<button data-m="sort" class="on">Sorting</button>
<button data-m="path">Pathfinding</button>
<button data-m="phys">Physics</button>
</nav>
<div id="ctl"></div>
<div id="bar">
<button id="go" class="pri">Start</button>
<button id="b2"></button>
<button id="b3" hidden>Random walls</button>
</div>
<div class="cv"><canvas id="cv"></canvas></div>
<p id="hint"></p>
<footer>Crafted with <span class="hrt">♥</span> by <b>ASDcuber521</b></footer>
</main>
<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),cx=cv.getContext('2d'),ctl=$('#ctl'),btn=$('#go');
let W=0,H=0,mode='sort',run=false,gen=null,acc=0,lw=0,paint=-1;
const C={},S={a:[],hl:[],fin:false},P={wall:new Uint8Array(0),vis:new Uint8Array(0),fr:new Uint8Array(0),path:[]},Y={};
const val=id=>+$('#'+id).value;
const sel=id=>$('#'+id).value;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sl=(id,l,a,b,v)=>`<label>${l}: <b id="${id}v">${v}</b><input type="range" id="${id}" min="${a}" max="${b}" value="${v}"></label>`;
const so=(id,l,o)=>`<label>${l}<select id="${id}">${o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></label>`;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function bind(root){
root.querySelectorAll('input[type=range]').forEach(i=>i.oninput=()=>{$('#'+i.id+'v').textContent=i.value;onParam(i.id)});
root.querySelectorAll('select').forEach(s=>s.onchange=()=>onParam(s.id));
}
function onParam(id){
if(mode==='sort'){if(id==='n'||id==='alg')initSort()}
else if(mode==='path'){if(id==='alg')resetSearch()}
else{if(id==='ph')physParams();initPhys()}
}
function setBtn(){btn.textContent=run?'Pause':'Start'}

function build(){
const m={
sort:so('alg','Algorithm',[['bubble','Bubble sort'],['insertion','Insertion sort'],['quick','Quick sort'],['merge','Merge sort']])+sl('n','Array size',5,150,50)+sl('spd','Speed',1,100,60),
path:so('alg','Algorithm',[['bfs','BFS'],['dfs','DFS'],['dijkstra','Dijkstra'],['astar','A*']])+sl('spd','Speed',1,100,70),
phys:so('ph','Simulation',[['proj','Projectile'],['pend','Pendulum'],['coll','Collisions']])+'<span id="pp"></span>'
};
ctl.innerHTML=m[mode];
bind(ctl);
if(mode==='phys')physParams();
$('#b2').textContent={sort:'Shuffle',path:'Clear walls',phys:'Restart'}[mode];
$('#b3').hidden=mode!=='path';
$('#hint').textContent=mode==='path'?'Click and drag on the grid to draw or erase walls.':'';
}

function physParams(){
const h={
proj:sl('p1','Angle (°)',5,85,45)+sl('p2','Speed (m/s)',5,60,30)+sl('p3','Gravity (m/s²)',1,25,10),
pend:sl('p1','Length (cm)',50,300,150)+sl('p2','Start angle (°)',10,80,45)+sl('p3','Gravity (m/s²)',1,25,10),
coll:sl('p1','Ball count',2,14,6)+sl('p2','Elasticity (%)',0,100,90)+sl('p3','Gravity',0,20,5)
};
$('#pp').innerHTML=h[sel('ph')];
bind($('#pp'));
}

function fit(){
const d=devicePixelRatio||1;
W=cv.parentElement.clientWidth;
H=Math.round(Math.max(300,Math.min(520,innerHeight*.55)));
cv.style.height=H+'px';
cv.width=W*d;cv.height=H*d;
cx.setTransform(d,0,0,d,0,0);
}

function initSort(){
run=false;gen=null;acc=0;S.fin=false;S.hl=[];
S.a=shuf(Array.from({length:val('n')},(_,i)=>i+1));
setBtn();
}
function* sortGen(){
const a=S.a,sw=(i,j)=>{[a[i],a[j]]=[a[j],a[i]]},k=sel('alg');
if(k==='bubble'){
for(let i=0;i<a.length;i++)for(let j=0;j<a.length-i-1;j++){S.hl=[j,j+1];if(a[j]>a[j+1])sw(j,j+1);yield}
}else if(k==='insertion'){
for(let i=1;i<a.length;i++)for(let j=i;j>0&&a[j-1]>a[j];j--){S.hl=[j-1,j];sw(j-1,j);yield}
}else if(k==='quick'){
function* qs(l,r){
if(l>=r)return;
const p=a[r];let i=l;
for(let j=l;j<r;j++){S.hl=[j,r];if(a[j]<p){sw(i,j);i++}yield}
sw(i,r);S.hl=[i];yield;
yield*qs(l,i-1);yield*qs(i+1,r);
}
yield*qs(0,a.length-1);
}else{
function* ms(l,r){
if(r<=l)return;
const m=(l+r)>>1;
yield*ms(l,m);yield*ms(m+1,r);
const L=a.slice(l,m+1),R=a.slice(m+1,r+1);
let i=0,j=0,q=l;
while(i<L.length||j<R.length){
if(j>=R.length||(i<L.length&&L[i]<=R[j]))a[q]=L[i++];else a[q]=R[j++];
S.hl=[q];q++;yield;
}
}
yield*ms(0,a.length-1);
}
}
function drawSort(){
const n=S.a.length,w=W/n,u=(H-16)/n,g=w>4?1:0;
S.a.forEach((v,i)=>{
const hot=S.hl.includes(i),x=i*w+g,bw=Math.max(1,w-2*g),bh=v*u,gr=cx.createLinearGradient(0,H-bh,0,H);
const c=S.fin?`hsl(${(i/n*200+performance.now()/12)%360} 85% 60%)`:hot?C.a2:C.ac;
gr.addColorStop(0,c);gr.addColorStop(1,hot||S.fin?c:C.p);
cx.shadowColor=c;cx.shadowBlur=hot?18:S.fin?10:0;
cx.fillStyle=gr;cx.beginPath();cx.roundRect(x,H-bh,bw,bh,Math.min(4,bw/2));cx.fill();
});
cx.shadowBlur=0;
}

function initGrid(){
const cs=Math.max(16,Math.floor(W/34)),c=Math.floor(W/cs),r=Math.floor(H/cs);
P.cs=cs;P.c=c;P.r=r;
P.wall=new Uint8Array(c*r);
P.s=(r>>1)*c+2;P.e=(r>>1)*c+c-3;
resetSearch();
}
function resetSearch(){
const n=P.c*P.r;
P.vis=new Uint8Array(n);P.fr=new Uint8Array(n);P.path=[];P.fail=false;P.fin=false;
gen=null;run=false;acc=0;setBtn();
}
function* pf(kind){
const{c,r,wall}=P,n=c*r,s=P.s,e=P.e;
const g=new Float64Array(n).fill(Infinity),pr=new Int32Array(n).fill(-1);
const h=i=>Math.abs(i%c-e%c)+Math.abs((i/c|0)-(e/c|0));
const open=[s];g[s]=0;P.fr[s]=1;
let found=false;
while(open.length){
let bi=0;
if(kind==='dfs')bi=open.length-1;
else if(kind!=='bfs'){
let b=Infinity;
open.forEach((v,k)=>{const f=g[v]+(kind==='astar'?h(v):0);if(f<b){b=f;bi=k}});
}
const cur=open.splice(bi,1)[0];
P.fr[cur]=0;
if(P.vis[cur])continue;
P.vis[cur]=1;
if(cur===e){found=true;break}
for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
const x=cur%c+dx,y=(cur/c|0)+dy;
if(x<0||y<0||x>=c||y>=r)continue;
const v=y*c+x;
if(wall[v]||P.vis[v])continue;
if(kind==='bfs'||kind==='dfs'){
if(pr[v]<0&&v!==s){pr[v]=cur;P.fr[v]=1;open.push(v)}
}else if(g[cur]+1<g[v]){
g[v]=g[cur]+1;pr[v]=cur;P.fr[v]=1;open.push(v);
}
}
yield;
}
if(found){
const p=[];
for(let i=P.e;i!==-1;i=pr[i])p.push(i);
for(const i of p.reverse()){P.path.push(i);yield}
}else P.fail=true;
}
function drawPath(){
const{cs,c,r}=P;
for(let i=0;i<c*r;i++){
let f=C.cell,a=1;
if(P.wall[i])f=C.wall;
else if(P.vis[i]){f=C.ac;a=.45}
else if(P.fr[i]){f=C.a2;a=.85}
cx.globalAlpha=a;cx.fillStyle=f;
cx.beginPath();cx.roundRect((i%c)*cs+1,(i/c|0)*cs+1,cs-2,cs-2,cs*.28);cx.fill();
}
cx.globalAlpha=1;
cx.fillStyle=C.ok;
cx.shadowColor=C.ok;cx.shadowBlur=14;
P.path.forEach(i=>{cx.beginPath();cx.roundRect((i%c)*cs+3,(i/c|0)*cs+3,cs-6,cs-6,cs*.3);cx.fill()});
cx.shadowBlur=0;
[[P.s,C.ok],[P.e,C.bad]].forEach(([i,f])=>{
cx.fillStyle=f;cx.beginPath();
cx.arc((i%c+.5)*cs,((i/c|0)+.5)*cs,cs*.38,0,7);cx.fill();
cx.strokeStyle=f;cx.lineWidth=2;cx.globalAlpha=.5;cx.beginPath();
cx.arc((i%c+.5)*cs,((i/c|0)+.5)*cs,cs*(.46+.12*Math.sin(performance.now()/300)),0,7);cx.stroke();cx.globalAlpha=1;
});
if(P.fail){cx.fillStyle=C.fg;cx.font='600 16px system-ui';cx.fillText('No path found',12,H-10)}
}
const cellAt=e=>{
const b=cv.getBoundingClientRect(),x=Math.floor((e.clientX-b.left)/P.cs),y=Math.floor((e.clientY-b.top)/P.cs);
return x<0||y<0||x>=P.c||y>=P.r?-1:y*P.c+x;
};
function put(i){
if(i===P.s||i===P.e||P.wall[i]===paint)return;
P.wall[i]=paint;
if(gen||P.fin)resetSearch();
}
cv.onpointerdown=e=>{
if(mode!=='path')return;
const i=cellAt(e);if(i<0)return;
paint=P.wall[i]?0:1;
cv.setPointerCapture(e.pointerId);
put(i);
};
cv.onpointermove=e=>{if(paint<0||mode!=='path')return;const i=cellAt(e);if(i>=0)put(i)};
cv.onpointerup=()=>{paint=-1};

function initPhys(){
const t=sel('ph'),p1=val('p1'),p2=val('p2'),p3=val('p3');
Y.t=t;Y.time=0;Y.trail=[];Y.hold=0;
if(t==='proj'){
const a=p1*Math.PI/180,v=p2,g=p3;
Y.a=a;Y.v=v;Y.g=g;Y.T=2*v*Math.sin(a)/g;
Y.R=v*v*Math.sin(2*a)/g;Y.Hm=Math.pow(v*Math.sin(a),2)/(2*g);
Y.sc=Math.min((W-60)/Math.max(Y.R,.1),(H-60)/Math.max(Y.Hm,.1));
}else if(t==='pend'){
Y.L=p1/100;Y.th=p2*Math.PI/180;Y.w=0;Y.g=p3;Y.sc=(H-70)/3.1;
}else{
Y.e=p2/100;Y.G=p3*30;
Y.b=Array.from({length:p1},()=>{
const r=12+Math.random()*16;
return{x:r+Math.random()*(W-2*r),y:r+Math.random()*(H/2-r),vx:(Math.random()-.5)*300,vy:(Math.random()-.5)*300,r,m:r*r};
});
}
}
function stepPhys(dt){
if(Y.t==='proj'){
if(Y.time>=Y.T){Y.hold+=dt;if(Y.hold>1)initPhys();return}
Y.time=Math.min(Y.T,Y.time+dt*Y.T/3.5);
const t=Y.time;
Y.trail.push([30+Y.v*Math.cos(Y.a)*t*Y.sc,H-30-(Y.v*Math.sin(Y.a)*t-Y.g*t*t/2)*Y.sc]);
}else if(Y.t==='pend'){
const h=dt/10;
for(let i=0;i<10;i++){Y.w+=-(Y.g/Y.L)*Math.sin(Y.th)*h;Y.th+=Y.w*h}
Y.trail.push([W/2+Y.L*Y.sc*Math.sin(Y.th),40+Y.L*Y.sc*Math.cos(Y.th)]);
if(Y.trail.length>70)Y.trail.shift();
}else{
const h=dt/4,B=Y.b;
for(let s=0;s<4;s++){
for(const b of B){
b.vy+=Y.G*h;b.x+=b.vx*h;b.y+=b.vy*h;
if(b.x<b.r){b.x=b.r;b.vx=-b.vx*Y.e}
if(b.x>W-b.r){b.x=W-b.r;b.vx=-b.vx*Y.e}
if(b.y<b.r){b.y=b.r;b.vy=-b.vy*Y.e}
if(b.y>H-b.r){b.y=H-b.r;b.vy=-b.vy*Y.e}
}
for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){
const p=B[i],q=B[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||.01,ov=p.r+q.r-d;
if(ov<=0)continue;
const nx=dx/d,ny=dy/d,tm=p.m+q.m;
p.x-=nx*ov*q.m/tm;p.y-=ny*ov*q.m/tm;
q.x+=nx*ov*p.m/tm;q.y+=ny*ov*p.m/tm;
const vn=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;
if(vn<0){
const j2=-(1+Y.e)*vn/(1/p.m+1/q.m);
p.vx-=j2*nx/p.m;p.vy-=j2*ny/p.m;
q.vx+=j2*nx/q.m;q.vy+=j2*ny/q.m;
}
}
}
}
}
function drawPhys(){
cx.fillStyle=C.fg;cx.font='13px system-ui';
if(Y.t==='proj'){
cx.fillStyle=C.wall;cx.fillRect(0,H-26,W,2);
cx.fillStyle=C.a2;
Y.trail.forEach((p,i)=>{cx.globalAlpha=.25+.75*i/Y.trail.length;cx.beginPath();cx.arc(p[0],p[1],2.4,0,7);cx.fill()});
cx.globalAlpha=1;
const l=Y.trail[Y.trail.length-1]||[30,H-30];
cx.shadowColor=C.ac;cx.shadowBlur=22;cx.fillStyle=C.ac;cx.beginPath();cx.arc(l[0],l[1],9,0,7);cx.fill();cx.shadowBlur=0;
cx.fillStyle=C.fg;
cx.fillText(`Flight time: ${Y.T.toFixed(2)} s   Range: ${Y.R.toFixed(1)} m   Max height: ${Y.Hm.toFixed(1)} m`,12,20);
}else if(Y.t==='pend'){
const l=Y.trail[Y.trail.length-1];
Y.trail.forEach((p,i)=>{cx.globalAlpha=i/Y.trail.length*.6;cx.fillStyle=C.a2;cx.beginPath();cx.arc(p[0],p[1],4,0,7);cx.fill()});
cx.globalAlpha=1;
if(l){
cx.strokeStyle=C.wall;cx.lineWidth=2;cx.beginPath();cx.moveTo(W/2,40);cx.lineTo(l[0],l[1]);cx.stroke();
cx.shadowColor=C.ac;cx.shadowBlur=24;cx.fillStyle=C.ac;cx.beginPath();cx.arc(l[0],l[1],14,0,7);cx.fill();cx.shadowBlur=0;
}
cx.fillStyle=C.wall;cx.beginPath();cx.arc(W/2,40,5,0,7);cx.fill();
cx.fillStyle=C.fg;
cx.fillText(`Period: ${(2*Math.PI*Math.sqrt(Y.L/Y.g)).toFixed(2)} s`,12,20);
}else{
Y.b.forEach(b=>{
const gr=cx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.3,b.r*.1,b.x,b.y,b.r),hu=(b.r*14)%360;
gr.addColorStop(0,`hsl(${hu} 90% 75%)`);gr.addColorStop(1,`hsl(${hu} 80% 50%)`);
cx.shadowColor=`hsl(${hu} 90% 60%)`;cx.shadowBlur=16;cx.fillStyle=gr;
cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fill();
});
}
}

function tick(){
if(!run||!gen)return;
acc+=0.05*Math.pow(1.07,val('spd'));
while(acc>=1&&gen){
acc--;
if(gen.next().done){
gen=null;run=false;
if(mode==='sort'){S.fin=true;S.hl=[]}else P.fin=true;
setBtn();
}
}
}
let last=performance.now();
function loop(now){
const dt=Math.min(.05,(now-last)/1000);last=now;
['ac','a2','ok','bad','wall','cell','fg'].forEach(n=>C[n]=css('--'+n));
C.p='#a855f7';
cx.clearRect(0,0,W,H);cx.shadowBlur=0;
if(mode==='sort'){tick();drawSort()}
else if(mode==='path'){tick();drawPath()}
else{if(run)stepPhys(dt);drawPhys()}
requestAnimationFrame(loop);
}

function init(){
if(mode==='sort')initSort();
else if(mode==='path')initGrid();
else{initPhys();run=true;setBtn()}
}
function setMode(m){
mode=m;run=false;gen=null;
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
build();fit();init();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
btn.onclick=()=>{
if(mode==='sort'){if(S.fin)initSort();if(!gen)gen=sortGen();run=!run}
else if(mode==='path'){if(P.fin)resetSearch();if(!gen)gen=pf(sel('alg'));run=!run}
else run=!run;
setBtn();
};
$('#b2').onclick=()=>{
if(mode==='sort')initSort();
else if(mode==='path'){P.wall.fill(0);resetSearch()}
else{initPhys();run=true;setBtn()}
};
$('#b3').onclick=()=>{
for(let i=0;i<P.wall.length;i++)P.wall[i]=i!==P.s&&i!==P.e&&Math.random()<.27?1:0;
resetSearch();
};
addEventListener('resize',()=>{if(innerWidth===lw)return;lw=innerWidth;fit();init()});
lw=innerWidth;
setMode('sort');
requestAnimationFrame(loop);
const bg=$('#bgc'),bx=bg.getContext('2d');
let pts=[],mx=-999,my=-999;
function bgFit(){
bg.width=innerWidth;bg.height=innerHeight;
pts=Array.from({length:Math.min(70,innerWidth/18|0)},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}));
}
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
function bgLoop(){
bx.clearRect(0,0,bg.width,bg.height);
bx.fillStyle=bx.strokeStyle=C.ac||'#5b8cff';
for(const p of pts){
p.x+=p.vx;p.y+=p.vy;
if(p.x<0||p.x>bg.width)p.vx*=-1;
if(p.y<0||p.y>bg.height)p.vy*=-1;
bx.globalAlpha=.5;bx.beginPath();bx.arc(p.x,p.y,1.6,0,7);bx.fill();
const d=Math.hypot(p.x-mx,p.y-my);
if(d<160){bx.globalAlpha=(1-d/160)*.5;bx.beginPath();bx.moveTo(p.x,p.y);bx.lineTo(mx,my);bx.stroke()}
}
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
if(d<120){bx.globalAlpha=(1-d/120)*.25;bx.beginPath();bx.moveTo(pts[i].x,pts[i].y);bx.lineTo(pts[j].x,pts[j].y);bx.stroke()}
}
bx.globalAlpha=1;
requestAnimationFrame(bgLoop);
}
bgFit();addEventListener('resize',bgFit);bgLoop();
</script>
</body>
